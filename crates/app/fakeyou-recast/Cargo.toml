[package]
name = "fakeyou-recast"
version = "0.1.0"
edition = "2021"
resolver = "2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]

model-serde = { path = "../../lib/model-serde" }

chrono = "0.4.22"
cpal = "0.14.0"
discord-presence = "0.5.9"
discord-rich-presence = "0.2.3"
fern = "0.6.1"
hound = "3.4.0"
iced = {version = "0.4.2", features=["tokio"]}
iced_aw = { version = "0.2.0", default-features=false, features=["card", "modal"]}
iced_native = "0.5.1"
json = "0.12.4" # untyped json crate, for processing responses which might not have fixed structure
log = "0.4.17"
native-dialog = "0.6.3"
reqwest = { version = "0.11.12", features=["json", "cookies"] }
ringbuf = "0.2.8"
rubato = "0.12.0"
tch = "0.8.0"
thiserror = "1.0"
async-fs = "1.6.0"
futures = "0.3.23"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.release]
#lto = true
strip = true
